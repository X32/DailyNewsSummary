services:
  app:
    platform: linux/arm64
    build: .
    volumes:
      - .:/app
    environment:
      - WATCHFILES_FORCE_POLLING=true
    command: >
      sh -c "pip install watchfiles &&
             python -c \"import uvicorn; uvicorn.run('main:app', host='0.0.0.0', port=8000, reload=True)\""
