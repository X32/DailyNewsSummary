name: Build and Deploy

on:
  push:
    branches: [release]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/dailynews

jobs:
  # ── 阶段1: 代码检查 ──
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: |
          pip install -r requirements.txt
          python -m py_compile main.py
          python -m py_compile crawler.py
          python -m py_compile summarize.py
          python -m py_compile news.py
          python -m py_compile schedule.py

  # ── 阶段2: 构建并推送 Docker 镜像 ──
  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ── 阶段3: SSH 部署到服务器 ──
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /opt/dailynews
            docker compose pull app
            docker compose up -d --remove-orphans
            docker image prune -f
            echo "Deploy completed at $(date)"

      - name: Notify Feishu on success
        if: success()
        run: |
          SIGN=$(python3 -c "
          import hmac, hashlib, base64, time
          ts = str(int(time.time()))
          s = '${{ secrets.FEISHU_WEBHOOK_SECRET }}'
          sign = base64.b64encode(hmac.new(f'{ts}\n{s}'.encode(), digestmod=hashlib.sha256).digest()).decode()
          print(f'{ts} {sign}')
          ")
          TIMESTAMP=$(echo "$SIGN" | cut -d' ' -f1)
          SIGN=$(echo "$SIGN" | cut -d' ' -f2)
          curl -s -X POST "${{ secrets.FEISHU_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d "{
              \"timestamp\": \"$TIMESTAMP\",
              \"sign\": \"$SIGN\",
              \"msg_type\": \"interactive\",
              \"card\": {
                \"header\": {
                  \"title\": { \"tag\": \"plain_text\", \"content\": \"✅ DailyNews 部署成功\" },
                  \"template\": \"green\"
                },
                \"elements\": [
                  { \"tag\": \"div\", \"text\": { \"tag\": \"lark_md\", \"content\": \"**分支:** ${{ github.ref_name }}\n**提交:** ${{ github.sha }}\n**触发者:** ${{ github.actor }}\n**时间:** $(date '+%Y-%m-%d %H:%M:%S')\" } }
                ]
              }
            }"

      - name: Notify Feishu on failure
        if: failure()
        run: |
          SIGN=$(python3 -c "
          import hmac, hashlib, base64, time
          ts = str(int(time.time()))
          s = '${{ secrets.FEISHU_WEBHOOK_SECRET }}'
          sign = base64.b64encode(hmac.new(f'{ts}\n{s}'.encode(), digestmod=hashlib.sha256).digest()).decode()
          print(f'{ts} {sign}')
          ")
          TIMESTAMP=$(echo "$SIGN" | cut -d' ' -f1)
          SIGN=$(echo "$SIGN" | cut -d' ' -f2)
          curl -s -X POST "${{ secrets.FEISHU_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d "{
              \"timestamp\": \"$TIMESTAMP\",
              \"sign\": \"$SIGN\",
              \"msg_type\": \"interactive\",
              \"card\": {
                \"header\": {
                  \"title\": { \"tag\": \"plain_text\", \"content\": \"❌ DailyNews 部署失败\" },
                  \"template\": \"red\"
                },
                \"elements\": [
                  { \"tag\": \"div\", \"text\": { \"tag\": \"lark_md\", \"content\": \"**分支:** ${{ github.ref_name }}\n**提交:** ${{ github.sha }}\n**触发者:** ${{ github.actor }}\n**时间:** $(date '+%Y-%m-%d %H:%M:%S')\" } }
                ]
              }
            }"
